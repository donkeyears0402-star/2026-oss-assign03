<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교재 수정 - 캠퍼스 중고교재</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="my.css">
</head>
<body>
  <div class="page-wrap">

    <nav class="navbar navbar-expand-md navbar-dark my-navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">캠퍼스 중고교재</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">목록</a></li>
            <li class="nav-item"><a class="nav-link" href="add.html">등록</a></li>
            <li class="nav-item"><a class="nav-link" href="example.html">Bootstrap 예제</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="page-main">
      <div class="container content-box">
        <div class="page-header">
          <h1 class="page-title">교재 수정</h1>
          <p class="page-desc">기존 1번 교재 값이 폼에 미리 들어 있습니다. 내용을 고친 뒤 [수정]을 누르세요.</p>
        </div>

        <!-- value="..." 로 기존 데이터를 미리 보여줍니다 -->
        <form class="my-form my-card" id="editForm" onsubmit="return checkEditForm();">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="bookTitle">교재명 <span class="required-mark">*</span></label>
              <input class="form-control" type="text" id="bookTitle" name="bookTitle" value="혼자 공부하는 자바">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="author">저자 <span class="required-mark">*</span></label>
              <input class="form-control" type="text" id="author" name="author" value="신용권">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="course">과목명 <span class="required-mark">*</span></label>
              <input class="form-control" type="text" id="course" name="course" value="객체지향프로그래밍">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="price">가격(원) <span class="required-mark">*</span></label>
              <input class="form-control" type="number" id="price" name="price" value="18000">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="bookCondition">책 상태 <span class="required-mark">*</span></label>
              <select class="form-select" id="bookCondition" name="bookCondition">
                <option value="">선택하세요</option>
                <option value="최상">최상</option>
                <option value="상" selected>상</option>
                <option value="중">중</option>
                <option value="하">하</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="saleStatus">판매 상태 <span class="required-mark">*</span></label>
              <select class="form-select" id="saleStatus" name="saleStatus">
                <option value="">선택하세요</option>
                <option value="판매중" selected>판매중</option>
                <option value="예약중">예약중</option>
                <option value="판매완료">판매완료</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="email">판매자 이메일 <span class="required-mark">*</span></label>
              <input class="form-control" type="text" id="email" name="email" value="junhyung@handong.edu">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label" for="regDate">등록일 <span class="required-mark">*</span></label>
              <input class="form-control" type="date" id="regDate" name="regDate" value="2026-09-10">
            </div>
          </div>

          <div class="btn-wrap">
            <button type="submit" class="btn btn-edit">수정</button>
            <a href="view.html" class="btn btn-outline-secondary">상세보기로</a>
            <a href="index.html" class="btn btn-outline-secondary">목록으로</a>
          </div>
        </form>
      </div>
    </main>

    <footer class="my-footer">
      <div class="container">
        캠퍼스 중고교재 · 21901037 이준형 · <a href="index.html">Home</a>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 입력값 검사: js/check.js 의 checkEditForm() 을 사용합니다 -->
  <script src="js/check.js"></script>
</body>
</html>
